name: ChronoPulse Security Hardening

on:
  push:
    branches:
      - security-hardening
    paths:
      - '.github/workflows/security-hardening.yml'
      - 'index.html'
      - 'app.js'
      - 'security-hardening.js'
      - 'SECURITY.md'
      - '.well-known/security.txt'

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.ref_name == 'security-hardening' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch only
        uses: actions/checkout@v4
        with:
          ref: security-hardening
          fetch-depth: 1

      - name: Apply browser-side hardening
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')

          meta = '<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"><meta http-equiv="Content-Security-Policy" content="default-src \'self\'; base-uri \'self\'; object-src \'none\'; frame-ancestors \'none\'; form-action \'self\'; script-src \'self\' \'unsafe-inline\' \'unsafe-eval\' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net; style-src \'self\' \'unsafe-inline\' https://fonts.googleapis.com; font-src \'self\' https://fonts.gstatic.com data:; img-src \'self\' data: blob: https:; connect-src \'self\' https: wss:; media-src \'self\' blob:; worker-src \'self\' blob:; upgrade-insecure-requests">'
          if 'http-equiv="Content-Security-Policy"' not in index:
              index = index.replace('<meta charset="UTF-8">', '<meta charset="UTF-8">' + meta, 1)
          elif 'permissions-policy' not in index:
              index = index.replace('<meta charset="UTF-8">', '<meta charset="UTF-8"><meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()">', 1)

          if 'security-hardening.js' not in index:
              marker = '<script src="app.js?v=2.8.0"></script>'
              replacement = '<script src="security-hardening.js"></script>' + marker
              if marker not in index:
                  raise SystemExit('app.js script marker not found; refusing to modify index.html')
              index = index.replace(marker, replacement, 1)

          guard = '''/* CHRONOPULSE_SECURITY_GUARD_V1 */\n(()=>{\n  const allowedHosts=new Set(['singularityx228.github.io','localhost','127.0.0.1']);\n  const h=location.hostname;\n  if(!allowedHosts.has(h)){\n    try{document.documentElement.innerHTML='<body style="background:#090d16;color:#fff;font-family:monospace;display:grid;place-items:center;height:100vh"><h1>ChronoPulse: unauthorized host</h1></body>';}catch(_){}\n    throw new Error('ChronoPulse host validation failed');\n  }\n})();\n'''
          if 'CHRONOPULSE_SECURITY_GUARD_V1' not in app:
              app = guard + app

          Path('index.html').write_text(index, encoding='utf-8')
          Path('app.js').write_text(app, encoding='utf-8')

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node --check app.js
          node --check security-hardening.js

      - name: Commit hardening changes back to security-hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js security-hardening.js
          if git diff --cached --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git commit -m "security: harden ChronoPulse client on security-hardening"
          git push origin HEAD:security-hardening
