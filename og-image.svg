<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#00f5a0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="ogShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>
  <rect width="1200" height="630" fill="url(#greenGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Header / Top Branding -->
  <g transform="translate(80, 65)">
    <!-- Small Icon -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="#090d16" stroke="#00f5a0" stroke-width="2.5"/>
    <circle cx="28" cy="28" r="14" fill="none" stroke="#00f5a0" stroke-width="3"/>
    <line x1="28" y1="18" x2="28" y2="28" stroke="#00d2ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="28" x2="35" y2="33" stroke="#00f5a0" stroke-width="3" stroke-linecap="round"/>

    <!-- TIMERX Title -->
    <text x="72" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="url(#logoGrad)">TIMER<tspan fill="#00f5a0">X</tspan></text>

    <!-- Global Badge -->
    <rect x="290" y="10" width="220" height="36" rx="18" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5"/>
    <text x="400" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#d8b4fe" text-anchor="middle" letter-spacing="1.5">🌍 CANLI 1v1 ARENASI</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 195)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Hassas Online Kronometre &amp;</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#00f5a0" letter-spacing="-0.5">Dünya Çapında 1v1 VS Düelloları</text>
    
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#94a3b8">
      0.001s milisaniye hassasiyetli kronometre, geri sayım ve refleks düello arenası.
    </text>
  </g>

  <!-- Feature Badges Bottom Row -->
  <g transform="translate(80, 420)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#ogShadow)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="45" font-size="24">👑</text>
      <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fbbf24">TİMİ BOT</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">Yapay Zeka Yarışı</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(230, 0)" filter="url(#ogShadow)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="45" font-size="24">⚔️</text>
      <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#c084fc">1v1 CANLI VS</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">Global Çok Oyunculu</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(460, 0)" filter="url(#ogShadow)">
      <rect width="210" height="110" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="45" font-size="24">⚡</text>
      <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#34d399">0 MS HASSAS</text>
      <text x="24" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">Milisaniye &amp; Salise</text>
    </g>
  </g>

  <!-- Giant Mockup Stopwatch on the Right -->
  <g transform="translate(940, 315)" filter="url(#ogShadow)">
    <!-- Outer Glow Dial -->
    <circle cx="0" cy="0" r="170" fill="#090d16" stroke="#1e293b" stroke-width="18"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#00f5a0" stroke-width="18" stroke-dasharray="800 300" stroke-dashoffset="120" stroke-linecap="round"/>
    
    <!-- Top Crown -->
    <rect x="-18" y="-195" width="36" height="20" rx="6" fill="#38bdf8"/>

    <!-- Inside Display -->
    <text x="0" y="15" font-family="'Consolas', 'Courier New', monospace" font-size="52" font-weight="900" fill="#00f5a0" text-anchor="middle" letter-spacing="-1">00.05.00</text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="4">MİLİSANİYE</text>
    <circle cx="0" cy="82" r="5" fill="#10b981"/>
  </g>

  <!-- Watermark URL bottom right -->
  <text x="1120" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#475569" text-anchor="end">singularityx228.github.io/chronopulse</text>
</svg>